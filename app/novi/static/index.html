<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a1230">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Novi">
  <title>Novi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/sidebar.css">
</head>
<body>
  <div class="shell">
    <aside id="side" aria-label="Sidebar">
      <div class="sbrand">
        <span class="logo" aria-hidden="true">n</span>
        <span class="name">novi</span>
        <button id="sidetoggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="collapse sidebar">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2.5"/><path d="M8 4v12"/></svg>
        </button>
      </div>
      <nav id="tabs" aria-label="Pages"></nav>
      <div class="sfoot"><span id="clock" class="muted"></span></div>
    </aside>
    <div id="backdrop" class="backdrop"></div>
    <div class="content">
      <div class="topbar">
        <button id="menu" type="button" aria-label="Open menu">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>
        </button>
        <span id="crumb">home</span>
      </div>
      <main id="main" class="grid"></main>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/sidebar.js"></script>
  <script src="/app.js"></script>
</body>
</html>
