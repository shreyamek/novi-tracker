<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{NAME}} - Cover letter</title>
<style>
  @page { size: letter; margin: 0.9in; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 11pt; line-height: 1.5; color: #1a1a1a; background: #fff; }
  .sender { margin-bottom: 18px; }
  .sender strong { font-size: 13pt; }
  .sender div { color: #444; font-size: 10pt; }
  .recipient { margin-bottom: 18px; }
  p { margin: 0 0 12px; }
</style>
</head>
<body>
<div class="sender">
  <strong>{{NAME}}</strong>
  <div>{{CONTACT}}</div>
</div>
<div class="recipient">
  <div>{{DATE}}</div>
  <div>{{COMPANY}}</div>
  <div>Re: {{ROLE}}</div>
</div>
<p>{{GREETING}}</p>
<!-- Body paragraphs: one for the role, one for the strongest verified example, one for why this company. Every fact must be in me/profile.md or confirmed by the person. -->
{{BODY_PARAGRAPHS}}
<p>{{CLOSING}}</p>
<p>{{NAME}}</p>
</body>
</html>
